# Builds the shipped program (LuigisMansionRecomp: setup + runtime) on Windows, Linux and macOS.
# No game data is involved: the lmrecomp dev build needs the user's main.dol and is skipped.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            preset: windows-clang
            artifact: windows-x64
          - name: Linux x86_64
            os: ubuntu-24.04
            preset: linux-clang
            artifact: linux-x86_64
          - name: macOS arm64
            os: macos-15
            preset: macos-clang
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build pkg-config \
            libvulkan-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libgles-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev libdrm-dev libgbm-dev libusb-1.0-0-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja llvm lld sdl3

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install ninja

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --target LuigisMansionRecomp

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          b=build/${{ matrix.preset }}
          cp "$b"/LuigisMansionRecomp* out/ 2>/dev/null || true
          cp "$b"/*.dll out/ 2>/dev/null || true
          cp "$b"/pipelines.bin NOTICE.md out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: LuigisMansionRecomp-${{ matrix.artifact }}
          path: out/
          if-no-files-found: error
